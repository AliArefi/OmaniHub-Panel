name: Deploy Panel SPA (panel.omanihub.com)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

concurrency:
  group: panel-react-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show Node/npm versions
        shell: bash
        run: |
          set -euo pipefail
          node -v
          npm -v

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --loglevel=notice

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm run build

      - name: Detect build output directory
        id: out
        shell: bash
        run: |
          set -euo pipefail

          if [ -d dist ]; then
            echo "dir=dist" >> "$GITHUB_OUTPUT"
          elif [ -d build ]; then
            echo "dir=build" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: build output missing"
            ls -la
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-spa
          path: ${{ steps.out.outputs.dir }}/
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    environment: VPS_HOST
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Sanity check required secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${{ secrets.VPS_HOST }}" ] || (echo "Missing VPS_HOST" && exit 1)
          [ -n "${{ secrets.VPS_USER }}" ] || (echo "Missing VPS_USER" && exit 1)
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || (echo "Missing VPS_SSH_KEY" && exit 1)
          [ -n "${{ secrets.VPS_PORT }}" ] || (echo "Missing VPS_PORT" && exit 1)
          [ -n "${{ secrets.PANEL_WEB_ROOT }}" ] || (echo "Missing PANEL_WEB_ROOT" && exit 1)

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: panel-spa
          path: out

      - name: Prepare SSH key
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keyscan -p "${{ secrets.VPS_PORT }}" -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        shell: bash
        run: |
          set -euo pipefail

          DEST_DIR="${{ secrets.PANEL_WEB_ROOT }}"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/vps_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=yes" \
            out/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${DEST_DIR%/}/"