name: Deploy Panel SPA (panel.omanihub.com)

on:
  push:
    branches: ["main"]

concurrency:
  group: panel-react-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Sanity check required secrets
        run: |
          [ -n "${{ secrets.VPS_HOST }}" ] || (echo "Missing VPS_HOST" && exit 1)
          [ -n "${{ secrets.VPS_USER }}" ] || (echo "Missing VPS_USER" && exit 1)
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || (echo "Missing VPS_SSH_KEY" && exit 1)
          [ -n "${{ secrets.VPS_PORT }}" ] || (echo "Missing VPS_PORT" && exit 1)
          [ -n "${{ secrets.WEB_ROOT }}" ] || (echo "Missing WEB_ROOT" && exit 1)
          [ -n "${{ secrets.PANEL_WEB_ROOT }}" ] || (echo "Missing PANEL_WEB_ROOT" && exit 1)

      - name: Build & Deploy over SSH (stable)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.WEB_ROOT }}"
            DEST_DIR="${{ secrets.PANEL_WEB_ROOT }}"

            echo "==> User: $(whoami)"
            echo "==> Repo dir: $APP_DIR"
            echo "==> Deploy dir: $DEST_DIR"

            mkdir -p "$APP_DIR"
            cd "$APP_DIR"

            # SSH setup
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            touch ~/.ssh/known_hosts
            chmod 600 ~/.ssh/known_hosts
            ssh-keygen -F github.com >/dev/null || ssh-keyscan -H github.com >> ~/.ssh/known_hosts

            cat > ~/.ssh/config << "EOF"
            Host github.com
              HostName github.com
              User git
              IdentityFile ~/.ssh/gha_panel
              IdentitiesOnly yes
            EOF
            chmod 600 ~/.ssh/config

            # Clone or update repo
            if [ ! -d .git ]; then
              if [ "$(ls -A . | wc -l)" -gt 0 ]; then
                echo "ERROR: $APP_DIR is not empty but has no .git."
                exit 2
              fi
              git clone git@github.com:${{ github.repository }}.git .
            else
              git fetch --all --prune
              git reset --hard origin/main
            fi

            # Load env if exists
            if [ -f .env.production ]; then
              set -a
              . ./.env.production
              set +a
              echo "==> Loaded .env.production"
            fi

            # =========================
            # 🔥 STABLE NPM SECTION
            # =========================

            export NODE_ENV=development

            echo "==> Node: $(node -v)"
            echo "==> NPM: $(npm -v)"

            # Fix npm instability
            npm config set fund false
            npm config set audit false

            # Fix cache issues (main cause of your error)
            npm cache verify || npm cache clean --force

            # Clean install (KEEP package-lock.json)
            rm -rf node_modules

            # Install dependencies safely
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund

            # Ensure vite exists
            if [ ! -f node_modules/.bin/vite ]; then
              echo "ERROR: vite not installed"
              ls -la node_modules/.bin || true
              exit 4
            fi

            # Build
            npm run build

            # =========================
            # 🚀 DEPLOY
            # =========================

            if [ -d dist ]; then
              OUT_DIR="dist"
            elif [ -d build ]; then
              OUT_DIR="build"
            else
              echo "ERROR: No build output found"
              ls -la
              exit 3
            fi

            mkdir -p "$DEST_DIR"
            rsync -av --delete "$OUT_DIR"/ "$DEST_DIR"/

            echo "==> Deploy complete"
            ls -la "$DEST_DIR"