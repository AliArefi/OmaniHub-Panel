name: Deploy Panel SPA (panel.omanihub.com)

on:
  push:
    branches: ["main"]

concurrency:
  group: panel-react-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3️⃣ Install deps
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build
      - name: Build
        run: npm run build

      # 5️⃣ Detect build dir
      - name: Detect build directory
        id: builddir
        run: |
          if [ -d "dist" ]; then
            echo "DIR=dist" >> $GITHUB_OUTPUT
          elif [ -d "build" ]; then
            echo "DIR=build" >> $GITHUB_OUTPUT
          else
            echo "No build folder found!"
            exit 1
          fi

      # 6️⃣ Deploy via rsync (FIXED VERSION)
      - name: Deploy to VPS
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete
          path: ${{ steps.builddir.outputs.DIR }}/
          remote_path: ${{ secrets.PANEL_WEB_ROOT }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # 7️⃣ Verify
      - name: Verify deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "==> Files:"
            ls -la ${{ secrets.PANEL_WEB_ROOT }}
