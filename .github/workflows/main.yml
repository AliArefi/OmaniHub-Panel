name: Deploy Panel SPA (panel.omanihub.com)

on:
  push:
    branches: ["main"]

concurrency:
  group: panel-react-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Setup Node (stable)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Build project
      - name: Build
        run: npm run build

      # 5️⃣ Detect build folder (Vite=dist, CRA=build)
      - name: Detect build directory
        id: builddir
        run: |
          if [ -d "dist" ]; then
            echo "DIR=dist" >> $GITHUB_OUTPUT
          elif [ -d "build" ]; then
            echo "DIR=build" >> $GITHUB_OUTPUT
          else
            echo "No build folder found!"
            exit 1
          fi

      # 6️⃣ Upload build as artifact (optional but good for debug)
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panel-build
          path: ${{ steps.builddir.outputs.DIR }}

      # 7️⃣ Deploy to VPS via rsync over SSH
      - name: Deploy to VPS
        uses: burnett01/rsync-deployments@v7.0.1
        with:
          switches: -avz --delete
          path: ${{ steps.builddir.outputs.DIR }}/
          remote_path: ${{ secrets.PANEL_WEB_ROOT }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_port: ${{ secrets.VPS_PORT }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      # 8️⃣ Post-deploy check
      - name: Verify deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "==> Deployed files:"
            ls -la ${{ secrets.PANEL_WEB_ROOT }}
